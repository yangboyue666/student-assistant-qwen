name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner IPv6 出口不可用，Java 默认优先 IPv6 会导致连接被拒；统一强制走 IPv4
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Gradle mirrors
        run: |
          mkdir -p "$HOME/.gradle"
          # GitHub runner 到 plugins-artifacts.gradle.org 被拒；全局（含 Flutter included build）
          # 用阿里云镜像替换 Gradle 插件门户 / Google / Maven Central
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          settingsEvaluated { s ->
            s.pluginManagement {
              repositories {
                clear()
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/public' }
                gradlePluginPortal()
              }
            }
          }
          EOF
          echo "== init.gradle =="; cat "$HOME/.gradle/init.gradle"

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pre-seed Gradle 8.14 distribution
        run: |
          mkdir -p "$HOME/.gradle/wrapper/dists/gradle-8.14-bin"
          chmod +x android/gradlew
          # 让真实 wrapper 算出它自己的哈希目录（联网被拒也会先建目录）
          (cd android && ./gradlew --version) >/dev/null 2>&1 || true
          DISTS="$HOME/.gradle/wrapper/dists/gradle-8.14-bin"
          HASH=$(find "$DISTS" -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | head -1)
          echo "wrapper hash = $HASH"
          ROOT="$DISTS/$HASH"; mkdir -p "$ROOT"
          # 用可靠的 curl 下载本体，使 wrapper 启动时跳过 Java 下载
          curl -4 -L --retry 5 --retry-all-errors \
            -o "$ROOT/gradle-8.14-bin.zip" \
            https://downloads.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -tq "$ROOT/gradle-8.14-bin.zip"
          (cd "$ROOT" && unzip -q gradle-8.14-bin.zip)
          touch "$ROOT/gradle-8.14-bin.zip.ok"
          "$ROOT/gradle-8.14/bin/gradle" --version

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
