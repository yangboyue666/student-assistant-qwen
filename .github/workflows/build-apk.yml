name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure global plugin repositories
        run: |
          mkdir -p "$HOME/.gradle"
          # beforeSettings 对所有构建生效，包括 Flutter 的 included build(flutter_tools)；
          # 把插件解析指向阿里云，避开被拒的 plugins-artifacts.gradle.org
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          gradle.beforeSettings { settings ->
            settings.pluginManagement {
              repositories {
                clear()
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/public' }
              }
            }
          }
          EOF

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pre-seed Gradle 8.14 distribution
        run: |
          mkdir -p "$HOME/.gradle/wrapper/dists/gradle-8.14-bin"
          chmod +x android/gradlew
          (cd android && ./gradlew --version) >/dev/null 2>&1 || true
          DISTS="$HOME/.gradle/wrapper/dists/gradle-8.14-bin"
          HASH=$(find "$DISTS" -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | head -1)
          echo "wrapper hash = $HASH"
          ROOT="$DISTS/$HASH"; mkdir -p "$ROOT"
          curl -4 -L --retry 5 --retry-all-errors \
            -o "$ROOT/gradle-8.14-bin.zip" \
            https://downloads.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -tq "$ROOT/gradle-8.14-bin.zip"
          (cd "$ROOT" && unzip -q gradle-8.14-bin.zip)
          touch "$ROOT/gradle-8.14-bin.zip.ok"
          "$ROOT/gradle-8.14/bin/gradle" --version

      - name: Warm kotlin-dsl plugin into shared cache
        run: |
          GR="$HOME/.gradle/wrapper/dists/gradle-8.14-bin/$(ls "$HOME/.gradle/wrapper/dists/gradle-8.14-bin" | head -1)/gradle-8.14/bin/gradle"
          mkdir -p /tmp/kd && cd /tmp/kd
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              maven { url 'https://maven.aliyun.com/repository/google' }
              maven { url 'https://maven.aliyun.com/repository/public' }
            }
          }
          include ':sub'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'org.gradle.kotlin.kotlin-dsl' version '5.2.0'
              id 'org.jetbrains.kotlin.jvm' version '2.2.20'
              id 'com.android.application' version '8.13.0' apply false
          }
          EOF
          mkdir -p sub/src/main
          cat > sub/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android { namespace 'com.warm.sub'; compileSdk 35 }
          EOF
          $GR :sub:help --no-daemon

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
