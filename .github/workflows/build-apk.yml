name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner IPv6 出口不可用，Java 默认优先 IPv6 会导致连接被拒；统一强制走 IPv4
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Gradle mirrors
        run: |
          # GitHub runner 到 plugins-artifacts.gradle.org 被拒；全局（含 Flutter included build）
          # 用阿里云镜像替换 Gradle 插件门户 / Google / Maven Central
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/public' }
              }
            }
            repositories {
              maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
              maven { url 'https://maven.aliyun.com/repository/google' }
              maven { url 'https://maven.aliyun.com/repository/public' }
            }
          }
          settingsEvaluated { s ->
            s.pluginManagement {
              repositories {
                maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
                maven { url 'https://maven.aliyun.com/repository/google' }
                maven { url 'https://maven.aliyun.com/repository/public' }
              }
            }
          }
          EOF
          echo "== init.gradle =="; cat "$HOME/.gradle/init.gradle"

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
