name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Network diagnostics
        run: |
          echo "== DNS =="; getent ahosts downloads.gradle.org | head; getent ahosts mirrors.cloud.tencent.com | head
          echo "== curl exact file, force IPv4 vs IPv6 =="
          curl -4 -s -m 20 -o /dev/null -w "ipv4 official:%{http_code} ip=%{remote_ip}\n" https://downloads.gradle.org/distributions/gradle-8.14-bin.zip || echo ipv4-fail
          curl -6 -s -m 20 -o /dev/null -w "ipv6 official:%{http_code} ip=%{remote_ip}\n" https://downloads.gradle.org/distributions/gradle-8.14-bin.zip || echo ipv6-fail
          echo "== Java reproduce (default) =="
          cat > /tmp/T.java <<'EOF'
          import java.net.*; import java.io.*;
          public class T { public static void main(String[] a) throws Exception {
            URL u = new URL("https://downloads.gradle.org/distributions/gradle-8.14-bin.zip");
            HttpURLConnection c=(HttpURLConnection)u.openConnection();
            c.setConnectTimeout(15000); c.connect();
            System.out.println("HTTP "+c.getResponseCode());
          }}
          EOF
          cd /tmp && javac T.java && java T || echo "JAVA-DEFAULT-FAIL"
          echo "== Java reproduce (preferIPv4) =="
          java -Djava.net.preferIPv4Stack=true T || echo "JAVA-IPV4-FAIL"

      - name: Build APK
        run: flutter build apk --release
        env:
          # runner 的 IPv6 出口被拒，Java 默认优先 IPv6 导致 wrapper 下载 Connection refused；强制走 IPv4
          JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
