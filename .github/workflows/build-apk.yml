name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner IPv6 出口不可用，Java 默认优先 IPv6 导致下载连接被拒；统一强制走 IPv4
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pre-seed Gradle distribution
        run: |
          chmod +x android/gradlew
          DISTS="$HOME/.gradle/wrapper/dists/gradle-8.10.2-bin"
          # 让真实 wrapper 先算出它的哈希目录（此步联网会被拒，忽略即可，目录会被创建）
          (cd android && ./gradlew --version) >/dev/null 2>&1 || true
          HASH=$(ls "$DISTS" 2>/dev/null | head -1)
          echo "wrapper hash dir = $HASH"
          ROOT="$DISTS/$HASH"
          # 用可靠的 curl 下载（强制 IPv4、跟随重定向、多次重试）
          curl -4 -L --retry 5 --retry-all-errors \
            -o "$ROOT/gradle-8.10.2-bin.zip" \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -tq "$ROOT/gradle-8.10.2-bin.zip"
          (cd "$ROOT" && unzip -q gradle-8.10.2-bin.zip)
          touch "$ROOT/gradle-8.10.2-bin.zip.ok"
          echo "== installed gradle =="
          "$ROOT/gradle-8.10.2/bin/gradle" --version

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
