name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner IPv6 出口不可用，Java 默认优先 IPv6 会导致连接被拒；统一强制走 IPv4
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pre-seed Gradle 8.14 distribution
        run: |
          # wrapper 的 distributionUrl 已指向腾讯镜像（对 Java 可能拒绝）；
          # 先用真实 wrapper 算出它自己的哈希目录（联网被拒也会建目录），再用可靠的 curl 下载填充，让 wrapper 跳过下载
          chmod +x android/gradlew
          DISTS="$HOME/.gradle/wrapper/dists/gradle-8.14-bin"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-$HOME/.gradle}"
          find "$HOME/.gradle/wrapper" -maxdepth 3 -type d 2>/dev/null | head -20
          (cd android && ./gradlew --version) >/dev/null 2>&1 || true
          echo "== dirs after wrapper attempt =="; find "$HOME/.gradle/wrapper" -maxdepth 3 -type d 2>/dev/null
          HASH=$(find "$DISTS" -maxdepth 1 -mindepth 1 -type d 2>/dev/null -exec basename {} \; | head -1)
          echo "wrapper hash = $HASH"
          ROOT="$DISTS/$HASH"
          mkdir -p "$ROOT"
          curl -4 -L --retry 5 --retry-all-errors \
            -o "$ROOT/gradle-8.14-bin.zip" \
            https://downloads.gradle.org/distributions/gradle-8.14-bin.zip
          unzip -tq "$ROOT/gradle-8.14-bin.zip"
          (cd "$ROOT" && unzip -q gradle-8.14-bin.zip)
          touch "$ROOT/gradle-8.14-bin.zip.ok"
          echo "== gradle 8.14 =="
          "$ROOT/gradle-8.14/bin/gradle" --version

      - name: Warm included-build plugin (kotlin-dsl) cache
        run: |
          # 以与 Flutter 完全相同的 includeBuild 方式联网跑一次，提前把 flutter_tools 所需的
          # org.gradle.kotlin.kotlin-dsl 等插件下载进共享缓存，消除 Flutter 构建时该请求的偶发拒绝
          GR="$HOME/.gradle/wrapper/dists/gradle-8.14-bin/$(ls "$HOME/.gradle/wrapper/dists/gradle-8.14-bin" | head -1)/gradle-8.14/bin/gradle"
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "flutter.sdk=${FLUTTER_ROOT}" >> local.properties
          $GR :app:help --no-daemon

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
