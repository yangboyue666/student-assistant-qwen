name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # runner IPv6 出口不可用，Java 默认优先 IPv6 导致下载连接被拒；统一强制走 IPv4
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Java precise probe
        run: |
          cat > /tmp/J.java <<'EOF'
          import java.net.*;
          public class J { static void t(String s){ try {
            HttpURLConnection c=(HttpURLConnection)new URL(s).openConnection();
            c.setConnectTimeout(12000); c.setReadTimeout(12000); c.setInstanceFollowRedirects(true);
            System.out.println(c.getResponseCode()+"  "+s+"  ->  "+c.getURL());
          } catch(Exception e){ System.out.println("FAIL "+s+"  "+e); } }
          public static void main(String[] a){
            t("https://services.gradle.org/distributions/gradle-8.10.2-bin.zip");
            t("https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip");
          }}
          EOF
          cd /tmp && javac J.java && java -Djava.net.preferIPv4Stack=true J

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk student-assistant-v1.3.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-assistant-apk
          path: student-assistant-v1.3.0.apk

      - name: Publish / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.3.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" student-assistant-v1.3.0.apk --clobber
          else
            gh release create "$TAG" student-assistant-v1.3.0.apk \
              --title "学生智能助手 v1.3.0" \
              --notes "修复本地 AI 模型下载与接入问题。下载此 APK 安装即可。"
          fi
